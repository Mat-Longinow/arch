<!-- ============================================================================
     OSP — DWTS 2026 LIVE STREAM — Webflow HTML Embed (the ONLY Designer step, ever).

     Paste this ONCE into an HTML Embed on a NEW, HIDDEN Webflow page (not linked in
     nav) that carries the site's normal header/footer. After that, every content
     change ships by `git push` to the page-guts files in this repo — no Designer,
     no permissions wall.

     What it does:
       1. ENV ROUTING — detects location.hostname. The live custom domain loads the
          production/ guts; any other host (Webflow staging *.webflow.io, preview
          links) loads the preview/ guts. Lets us stage changes before go-live.
       2. SCRIPT REHYDRATION — innerHTML does NOT execute injected <script> tags, so
          the loader re-creates each injected <script> into a fresh element. Kept for
          parity/future-proofing — this page is static today (no CMS).

     PROD_HOST reused from the confirmed DWTS 2026 event page (Mat 2026-06-23):
        ospshasta.org (the One SAFE Place live domain). www. is stripped before the
        compare, so www.ospshasta.org also routes to production.
     ============================================================================ -->
<div id="lc-block-dwts-livestream-2026" class="lc-embed"></div>
<script>
(function () {
  var TARGET    = "lc-block-dwts-livestream-2026";
  var PROD_HOST = "ospshasta.org"; // confirmed by Mat 2026-06-23 (www. stripped below)
  var REPO_BASE = "https://raw.githubusercontent.com/Mat-Longinow/arch/main/osp/pages/dwts-livestream-2026/";

  var host   = location.hostname.replace(/^www\./, "");
  var isProd = (host === PROD_HOST);
  var SRC    = REPO_BASE + (isProd ? "production" : "preview") + "/dwts-livestream-2026.html";

  fetch(SRC, { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var target = document.getElementById(TARGET);
      target.innerHTML = html;
      // innerHTML doesn't run injected <script> — re-create each so any future script fires.
      target.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++) {
          s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        }
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error("LC DWTS Live Stream embed load failed:", e); });
})();
</script>
