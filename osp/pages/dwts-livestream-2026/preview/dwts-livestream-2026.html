<!--
  PAGE: DWTS 2026 Live Stream (One SAFE Place) — page-guts for the Webflow Hybrid loader.
  ENV: preview  (loaded by every NON-production host: Webflow staging *.webflow.io, share links)

  WHAT THIS PAGE IS: a HIDDEN page, not linked in site nav. Sarah asked (7/30 weekly) for
  a template she can hand Benji: a page that carries the site's normal header/footer
  (that's Webflow's shell, untouched by these guts) with an otherwise-blank body holding
  ONE placeholder embed block. This is the page a Donor Perfect paywall link will point
  viewers to for the DWTS live stream. Benji is still finalizing Vimeo vs. YouTube — do
  NOT guess a platform or fabricate an embed code. When Sarah/Benji hand over the real
  embed code (a Vimeo/YouTube iframe snippet), replace the placeholder <div> below with
  it verbatim and ship.

  Body-only guts, no CMS — same static-page pattern as clc/pages/cops-cones-2026.
-->

<div class="services-holder crt-section-2">
  <div class="page-padding">
    <div class="container-large">
      <div class="padding-vertical no-padding">
        <div class="div-block-19">
          <h1 class="heading-6">Dancing with the Shasta Stars — Live Stream</h1>
        </div>
        <p class="paragraph-12 crt-info-blurb">
          Thanks for tuning in! The stream is free, thanks to our sponsor. It appears below on show night (Sat Oct 17) - also on YouTube and Facebook.
        </p>

        <div id="lc-dwts-livestream-embed" style="position:relative; width:100%; max-width:960px; aspect-ratio:16/9; margin:2rem auto; background:#1a1a1a; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; text-align:center; padding:1rem;">
          The stream appears here on show night.
        </div>
        <script>
        (function () {
          var prod = /^(www\.)?ospshasta\.org$/.test(location.hostname);
          fetch("https://raw.githubusercontent.com/Mat-Longinow/arch/main/osp/site/" + (prod ? "live-stream.json" : "live-stream.preview.json") + "?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (c) {
              var box = document.getElementById("lc-dwts-livestream-embed");
              var u; try { u = new URL(c.embed_url); } catch (e) { return; }
              if (u.protocol !== "https:" || !/^(www\.youtube\.com|www\.youtube-nocookie\.com|www\.facebook\.com|player\.vimeo\.com)$/.test(u.hostname)) return;
              var f = document.createElement("iframe");
              f.src = u.href; f.title = c.modal_title || "Live stream";
              f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
              f.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0";
              box.textContent = ""; box.appendChild(f);
            }).catch(function () {});
        })();
        </script>

      </div>
    </div>
  </div>
</div>
