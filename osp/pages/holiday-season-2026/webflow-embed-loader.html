<!-- ============================================================================
     OSP — HOLIDAY SEASON 2026 — Webflow HTML Embed (the ONLY Designer-side step, ever).

     Lives on the Webflow page at slug  holiday-season-2026  (OSP site, page id
     6ab54893a2c8b107cd314172). The slug is FINAL: a QR code is printed against
     https://www.ospshasta.org/holiday-season-2026 — do not rename the page.

     After this is in place every content change (a card link, copy, the flyer) ships by
     `git push` to the guts in this repo. No Designer, ever again.
     PROD_HOST = ospshasta.org (www. stripped). Any other host loads the preview/ guts.
     ============================================================================ -->
<div id="lc-block-holiday-2026" class="lc-embed"></div>
<script>
(function () {
  var TARGET    = "lc-block-holiday-2026";
  var PROD_HOST = "ospshasta.org";
  var REPO_BASE = "https://raw.githubusercontent.com/Mat-Longinow/arch/main/osp/pages/holiday-season-2026/";

  var host   = location.hostname.replace(/^www\./, "");
  var isProd = (host === PROD_HOST);
  var SRC    = REPO_BASE + (isProd ? "production" : "preview") + "/holiday-season-2026.html";

  fetch(SRC, { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var target = document.getElementById(TARGET);
      target.innerHTML = html;
      // innerHTML doesn't run injected <script> — re-create each so the card-state script fires.
      target.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++) {
          s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        }
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error("LC Holiday-2026 embed load failed:", e); });
})();
</script>
