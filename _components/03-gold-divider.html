<!--
  COMPONENT: Gold Divider Bar — the signature CLC accent
  KEY CLASS: .yellow-div  (34 CLC pages — appears under nearly every section title)
  WHAT: A short horizontal gold bar under a heading. Pure var(--gold) background.
  BRAND COLOR: auto.

  VARIANTS (pick by context):
    .yellow-div            -> centered (default)
    .yellow-div.left-side  -> left-aligned (under a left text pane, e.g. double-pane A)
    .yellow-div._2         -> margin variant (used in newsletter / stacked blocks)
    .yellow-div-copy       -> variant used under centered grid headings (see 06)

  ⚠️ "yellow" is a legacy name — it renders GOLD (var(--gold) = #f2be00 on CLC).
-->
<div class="yellow-div"></div>            <!-- centered -->
<div class="yellow-div left-side"></div>  <!-- left-aligned -->
<div class="yellow-div _2"></div>         <!-- margin variant -->
<div class="yellow-div-copy"></div>       <!-- centered-grid variant -->
