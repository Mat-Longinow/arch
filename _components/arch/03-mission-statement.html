     spans carry the inline color/italic emphasis (resolve via Arch :root). -->
<div class="mission-who">
  <div class="page-padding-2">
    <div class="container-large-2">
      <div class="vertical-page">
        <div id="our-mission" class="mission">
          <div class="main-div mission _3">
            <div class="h4-mission center">
              <h4 class="h4-type-copy blue">Our Mission</h4>
            </div>
            <div class="sub-body">
              <h2 class="h2-text">Our mission is to provide holistic<em>, </em><span class="text-span-3"><em class="italic-text">family-centered care</em></span><em> </em>for victims of trauma impacted by abuse, neglect, violence and exploitation.</h2>
              <h2 class="h2-text">By fostering a <span class="text-span-4"><em class="italic-text-2">collaborative</em></span>, multi-agency approach, we offer safety, hope, and healing through an <span class="text-span-5"><em class="italic-text-3">innovative</em></span> continuum of services.</h2>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
