<!-- 14 — News collection grid. CMS blog/news card grid. Wrapper set 6 (.page-padding-6
     / .container-large-6 / .vertical-page-3). Three .hold-box columns; the middle holds
     the bound collection. Bind .collection-list-2.blogs-list to a Webflow Blog
     collection in the Designer — page-guts carries the wrapper + empty-state; the cards
     repeat from CMS. -->
<div class="news-sec closer">
  <div class="page-padding-6">
    <div class="container-large-6">
      <div class="vertical-page-3">

        <div class="hold-box middle">
          <h4 class="news-h4">Blogs &amp; News</h4>
          <div class="collection-list-wrapper w-dyn-list">
            <div role="list" class="collection-list-2 blogs-list w-dyn-items">
              <div role="listitem" class="collection-item-2 w-dyn-item">
                <a href="#" class="link-block-8 w-inline-block">
                  <div class="div-block-78"><img loading="lazy" src="" alt="" class="image-20 w-dyn-bind-empty"></div>
                  <div class="div-block-79">
                    <div class="text-block-31 w-dyn-bind-empty"></div>
                    <div class="text-block-32">Read more</div>
                  </div>
                </a>
              </div>
            </div>
            <div class="w-dyn-empty"><div>No items found.</div></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
