<!-- 01 — Hero (logo) -->
<div class="hero">
  <div class="wrapper-title">
    <div class="wrapper-title overlay">
      <div class="container-large">
        <div class="div-block-28 logo our-story-logo">
          <img src="images/Dark_Background_Logo-removebg-preview-1.png" loading="lazy" alt="Arch Collaborative" class="image-10">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 03 — Mission statement (wrapper set 2) -->
<div class="mission-who">
  <div class="page-padding-2">
    <div class="container-large-2">
      <div class="vertical-page">
        <div id="our-mission" class="mission">
          <div class="main-div mission _3">
            <div class="h4-mission center">
              <h4 class="h4-type-copy blue our-story-title">Page Title</h4>
              <div class="yellow-div-longer"></div>
            </div>

            <!-- 07 — Double-pane nested in the mission block -->
            <div class="w-row">
              <div class="column-14 w-col w-col-6">
                <div class="text2 our-story-text">Intro body copy goes here.</div>
              </div>
              <div class="column-13 w-col w-col-6">
                <div class="div-block-39 _2"><img src="images/your-image.jpg" loading="lazy" alt=""></div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 09 — Text section (bare wrapper) with 05 heading + 10 CTA -->
<div class="page-padding">
  <div class="our-team full">
    <h3 class="heading-10-copy">Section Heading</h3>

    <div class="careers-text _2">

      <div class="div-block-93">

          </a>
        </div>
      </div>
    </div>
  </div>
</div>
