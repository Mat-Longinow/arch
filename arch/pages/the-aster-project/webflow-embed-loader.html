<!-- ============================================================================
     THE ASTER PROJECT — Webflow HTML Embed (the ONLY Designer step, ever).

     Paste this ONCE into an HTML Embed that replaces the Aster page body in the
     Webflow Designer. After that, every content change ships by `git push` to the
     page-guts files in this repo — no Designer, no permissions wall.

     What it does:
       1. ENV ROUTING — detects location.hostname. The live custom domain loads the
          production/ guts; any other host (Webflow staging *.webflow.io, preview
          links) loads the preview/ guts. Lets us stage changes before go-live.
       2. SCRIPT REHYDRATION — innerHTML does NOT execute injected <script> tags, so
          the loader re-creates each injected <script> into a fresh element. This is
          what makes the CMS team-render script actually run after injection.

     ⚠️ PROD_HOST is a best guess (archcollaborative.org). CONFIRM with Mat before
        go-live and update the constant if the live domain differs. Until confirmed,
        a wrong PROD_HOST only means the live site would load preview/ guts — safe
        (preview renders a superset), just not the intended prod gating.
     ============================================================================ -->
<div id="lc-block-aster" class="lc-embed"></div>
<script>
(function () {
  var TARGET    = "lc-block-aster";
  var PROD_HOST = "archcollaborative.org"; // ⚠️ CONFIRM with Mat before go-live
  var REPO_BASE = "https://raw.githubusercontent.com/Mat-Longinow/arch/main/arch/pages/the-aster-project/";

  var host   = location.hostname.replace(/^www\./, "");
  var isProd = (host === PROD_HOST);
  var SRC    = REPO_BASE + (isProd ? "production" : "preview") + "/the-aster-project.html";

  fetch(SRC, { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var target = document.getElementById(TARGET);
      target.innerHTML = html;
      // innerHTML doesn't run injected <script> — re-create each so the CMS render fires.
      target.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++) {
          s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        }
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error("LC Aster embed load failed:", e); });
})();
</script>
